[project]
name = "sourcebound-pptx"
version = "0.1.0"
description = "Sourcebound plugin: a piece's slides as a PowerPoint file in a template's master, with editable text and charts in the design's style"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Julian Hilg" }]
dependencies = ["python-pptx>=1.0", "matplotlib>=3.9", "pyyaml>=6", "sourcebound-linkedin"]

[project.entry-points."sourcebound.plugins"]
pptx = "sourcebound_pptx:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcebound_pptx"]
