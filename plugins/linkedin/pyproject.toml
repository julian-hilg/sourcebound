[project]
name = "sourcebound-linkedin"
version = "0.1.0"
description = "Sourcebound plugin: slides and infographics (PNG, carousel PDF) from a piece, with layout checks, and what a LinkedIn post needs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Julian Hilg" }]
dependencies = ["jinja2>=3.1", "pyyaml>=6"]

[project.entry-points."sourcebound.plugins"]
linkedin = "sourcebound_linkedin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcebound_linkedin"]
