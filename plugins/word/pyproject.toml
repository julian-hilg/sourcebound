[project]
name = "sourcebound-word"
version = "0.1.0"
description = "Word documents for Sourcebound: render into a .docx template, keep numbers and citations linked after manual edits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Julian Hilg" }]
dependencies = ["python-docx>=1.1", "pyyaml>=6"]

[project.entry-points."sourcebound.plugins"]
word = "sourcebound_word:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcebound_word"]
