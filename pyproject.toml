[project]
name = "sourcebound"
version = "0.1.0"
description = "Agent-orchestrated research and content with end-to-end provenance: evidence ledger, recorded results, data lake, desks and pieces, formats as plugins, safe publishing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Julian Hilg" }]
dependencies = [
    "duckdb>=1.4",
    "polars>=1.30",
    "pyarrow>=18",
    "httpx>=0.28",
    "pyyaml>=6",
    "zstandard>=0.23",
    "pypdf>=5",                     # PDF text where pdftotext (poppler) is not installed
    "numpy>=2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/julian-hilg/sourcebound"

[project.optional-dependencies]
browser = ["playwright>=1.50"]
sql = ["connectorx>=0.4"]        # sources.query by URI (SQL Server, Postgres, ...)
# Output formats beyond LaTeX are plugins with their own dependencies (plugins/ in the checkout):
word = ["sourcebound-word"]          # Word documents from .docx/.dotx templates, with a round trip
linkedin = ["sourcebound-linkedin"]  # slides, infographics and posts (HTML templates; a Chromium for PNG and PDF)
pptx = ["sourcebound-pptx"]          # slides as PowerPoint in a master (python-pptx; needs linkedin for the deck format)

[project.scripts]
sb = "sourcebound.cli:main"

[tool.uv.sources]
sourcebound-word = { path = "plugins/word", editable = true }
sourcebound-linkedin = { path = "plugins/linkedin", editable = true }
sourcebound-pptx = { path = "plugins/pptx", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcebound"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipelines", "plugins"]
addopts = "--import-mode=importlib"      # several pipelines have a test_pipeline.py
